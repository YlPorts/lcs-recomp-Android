name: Android APK

on:
  push:
    branches: [android-port]
    paths: ["android/**", "lcs/**", "src/**", "include/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", "lcs/**", "src/**", "include/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lcs-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify direct 0.6.16 source
        run: |
          python3 android/tests/scale_config_regression.py
          python3 android/tests/capture_ui_contract.py
      - name: Component and audio regression tests
        run: |
          mkdir -p android/test-results
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -I lcs/host android/tests/android_regression.cpp lcs/host/lcs_render_capture.cpp -pthread -o /tmp/components
          /tmp/components | tee android/test-results/components.txt
          g++ -std=c++20 -O2 -D__ANDROID__ -pthread -Iandroid/tests/shim -Ilcs/host android/tests/audio_continuity.cpp lcs/host/lcs_render_capture.cpp -pthread -o /tmp/audio
          /tmp/audio | tee android/test-results/audio.txt
          g++ -std=c++20 -O1 -g -D__ANDROID__ -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Iandroid/tests/shim -Ilcs/host android/tests/audio_continuity.cpp lcs/host/lcs_render_capture.cpp -pthread -o /tmp/audio-san
          /tmp/audio-san | tee android/test-results/audio-sanitized.txt
          python3 android/tests/frame_boundary_regression.py | tee android/test-results/frame-boundaries.txt
          python3 android/tests/pacing_regression.py | tee android/test-results/pacing.txt
      - name: CPU geometry regression tests
        run: |
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/cpu_geometry_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/geometry
          /tmp/geometry | tee android/test-results/geometry.txt
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/vertex_bytes_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/vertex-bytes
          /tmp/vertex-bytes | tee android/test-results/vertex-bytes.txt
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/vertex_bytes_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/vertex-bytes-san
          /tmp/vertex-bytes-san | tee android/test-results/vertex-bytes-sanitized.txt
      - name: Exact lighting cache regression
        run: |
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/lighting_cache_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/lighting-cache
          /tmp/lighting-cache | tee android/test-results/lighting-cache.txt
      - name: GE command state and record reuse regressions
        run: |
          set -euo pipefail
          python3 android/tests/scale_config_regression.py | tee android/test-results/scale-config.txt
          for mode in optimized sanitized; do
            FLAGS="-std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"
            if [ "$mode" = sanitized ]; then FLAGS="-std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"; fi
            g++ $FLAGS -Drender_ge_primitive=test_capture_primitive -Dflush_ge_deferred_rasterization=test_flush -c lcs/host/lcs_ge_exec.cpp -o /tmp/ge-exec-$mode.o
            g++ $FLAGS android/tests/ge_command_state_regression.cpp src/guest_memory.cpp /tmp/ge-exec-$mode.o -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/ge-state-$mode
            /tmp/ge-state-$mode | tee android/test-results/ge-state-$mode.txt
            g++ $FLAGS android/tests/vertex_memo_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/vertex-memo-$mode
            /tmp/vertex-memo-$mode | tee android/test-results/vertex-memo-$mode.txt
          done
          git show 2bd2ce61a3e155595c1eeb131cccd41b287aa6bb:lcs/host/lcs_ge_exec.cpp > /tmp/ge-exec-before.cpp
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host -Drender_ge_primitive=test_capture_primitive -Dflush_ge_deferred_rasterization=test_flush -c /tmp/ge-exec-before.cpp -o /tmp/ge-exec-before.o
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/ge_command_state_regression.cpp src/guest_memory.cpp /tmp/ge-exec-before.o -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/ge-state-before
          if /tmp/ge-state-before > android/test-results/ge-matrix-before.txt; then echo "Old executor unexpectedly passed"; exit 1; fi
          if /tmp/ge-state-before palette > android/test-results/ge-palette-before.txt; then echo "Old executor unexpectedly passed"; exit 1; fi
      - name: Texture LOD palette and cross-draw regression tests
        run: |
          set -euo pipefail
          for mode in optimized sanitized; do
            FLAGS="-std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"
            if [ "$mode" = sanitized ]; then FLAGS="-std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"; fi
            for test in texture_state_0613 vertex_state_0613; do
              g++ $FLAGS android/tests/$test.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/$test-$mode
              /tmp/$test-$mode | tee android/test-results/$test-$mode.txt
            done
          done
          git show e5e48f760c7ec3b73a1d7a1055b9d7a3f9128a0a:lcs/host/ge_renderer.cpp > /tmp/ge-renderer-before.cpp
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host '-DLCS_TEST_RENDERER="/tmp/ge-renderer-before.cpp"' android/tests/texture_state_0613.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/texture-before
          if /tmp/texture-before > android/test-results/mip-palette-before.txt; then echo "Old mip reader unexpectedly passed"; exit 1; fi
          if /tmp/texture-before hash > android/test-results/texture-hash-before.txt; then echo "Old sampled hash unexpectedly passed"; exit 1; fi
      - name: Effects continuity and GE control-flow regressions
        run: |
          set -euo pipefail
          for mode in optimized sanitized; do
            FLAGS="-std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"
            SAN=""
            if [ "$mode" = sanitized ]; then FLAGS="-std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"; SAN="-fsanitize=address,undefined -fno-omit-frame-pointer"; fi
            g++ $FLAGS -Drender_ge_primitive=test_capture_primitive -Dflush_ge_deferred_rasterization=test_flush -c lcs/host/lcs_ge_exec.cpp -o /tmp/ge-control-$mode.o
            g++ $FLAGS android/tests/ge_control_regression.cpp src/guest_memory.cpp /tmp/ge-control-$mode.o -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/ge-control-$mode
            /tmp/ge-control-$mode | tee android/test-results/ge-control-$mode.txt
            g++ -std=c++20 -O1 -g $SAN -D__ANDROID__ -pthread -Iandroid/tests/shim -Ilcs/host android/tests/audio_deadline_regression.cpp lcs/host/lcs_render_capture.cpp -pthread -o /tmp/audio-deadline-$mode
            /tmp/audio-deadline-$mode | tee android/test-results/audio-deadline-$mode.txt
          done
          git show fffaaf08624128ad22c9303b1024d736975e9615:lcs/host/lcs_ge_exec.cpp > /tmp/ge-control-before.cpp
          FLAGS="-std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"
          g++ $FLAGS -Drender_ge_primitive=test_capture_primitive -Dflush_ge_deferred_rasterization=test_flush -c /tmp/ge-control-before.cpp -o /tmp/ge-control-before.o
          g++ $FLAGS android/tests/ge_control_regression.cpp src/guest_memory.cpp /tmp/ge-control-before.o -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/ge-control-before
          for mode in call bbox; do
            if /tmp/ge-control-before $mode > android/test-results/ge-control-before-$mode.txt 2>&1; then echo "Old control flow unexpectedly passed"; exit 1; fi
          done
          mkdir -p /tmp/audio-before
          for name in lcs_audio_output.cpp lcs_audio_output_android.inc; do git show fffaaf08624128ad22c9303b1024d736975e9615:lcs/host/$name > /tmp/audio-before/$name; done
          g++ -std=c++20 -O2 -D__ANDROID__ -pthread -Iandroid/tests/shim -I/tmp/audio-before -Ilcs/host android/tests/audio_deadline_regression.cpp lcs/host/lcs_render_capture.cpp -pthread -o /tmp/audio-deadline-before
          if /tmp/audio-deadline-before > android/test-results/audio-deadline-before.txt 2>&1; then echo "Old audio unexpectedly passed"; exit 1; fi
      - name: Install graphics test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools ccache libegl1-mesa-dev libgles2-mesa-dev
      - name: Actual GLES backend regression tests
        run: |
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host -c android/tests/reference_fragments.cpp -o /tmp/reference-fragments.o
          g++ -std=c++20 -O2 -D__ANDROID__ -Iandroid/tests/shim -Iandroid/app/src/main/cpp -Ilcs/host android/tests/gles_backend_integration.cpp lcs/host/lcs_android_build.cpp /tmp/reference-fragments.o -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -lEGL -lGLESv2 -o /tmp/gles-backend
          /tmp/gles-backend | tee android/test-results/gles-backend-fetch.txt
          PSPRECOMP_GLES_FB_FETCH=0 /tmp/gles-backend | tee android/test-results/gles-backend-copy.txt
          python3 android/tests/gles_smoke.py | tee android/test-results/shader-readback.txt
      - name: Actual shared depth and CPU batch recycling regressions
        run: |
          set -euo pipefail
          FLAGS="-std=c++20 -O2 -D__ANDROID__ -Iandroid/tests/shim -Iandroid/app/src/main/cpp -Ilcs/host"
          g++ $FLAGS android/tests/gles_depth_regression.cpp lcs/host/lcs_android_build.cpp -pthread lcs/host/lcs_render_capture.cpp -lEGL -lGLESv2 -o /tmp/gles-depth
          /tmp/gles-depth | tee android/test-results/gles-depth-fetch.txt
          PSPRECOMP_GLES_FB_FETCH=0 /tmp/gles-depth | tee android/test-results/gles-depth-copy.txt
          git show fffaaf08624128ad22c9303b1024d736975e9615:lcs/host/ge_gpu_backend_gles.cpp > /tmp/gles-depth-before.cpp
          g++ $FLAGS -DLCS_BASELINE_TEST '-DLCS_GLES_SOURCE="/tmp/gles-depth-before.cpp"' android/tests/gles_depth_regression.cpp lcs/host/lcs_android_build.cpp -pthread lcs/host/lcs_render_capture.cpp -lEGL -lGLESv2 -o /tmp/gles-depth-before
          if /tmp/gles-depth-before > android/test-results/gles-depth-before.txt 2>&1; then echo "Old depth state unexpectedly passed"; exit 1; fi
      - name: Frame capture and position pretest regressions
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -Ilcs/host android/tests/capture_archive_regression.cpp lcs/host/lcs_render_capture.cpp -o /tmp/capture-archive
          /tmp/capture-archive /tmp/lcs-capture-tests | tee android/test-results/capture-archive.txt
          python3 android/tests/capture_zip_verify.py /tmp/lcs-capture-tests | tee android/test-results/capture-zip.txt
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/early_position_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/early-position
          /tmp/early-position | tee android/test-results/early-position.txt
          python3 android/tests/feedback_extent_regression.py | tee android/test-results/feedback-extent.txt
          g++ -std=c++20 -O2 -D__ANDROID__ -Iandroid/tests/shim -Iandroid/app/src/main/cpp -Ilcs/host -Iinclude android/tests/feedback_capture_backend.cpp lcs/host/lcs_android_build.cpp lcs/host/lcs_render_capture.cpp -lEGL -lGLESv2 -pthread -o /tmp/feedback-capture
          /tmp/feedback-capture /tmp/lcs-capture-tests/gpu.zip | tee android/test-results/feedback-capture.txt
          python3 android/tests/capture_zip_verify.py /tmp/lcs-capture-tests | tee android/test-results/capture-gpu-zip.txt

      - name: Texture row alignment and cache coverage regression
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/texture_stride_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/texture-stride
          /tmp/texture-stride | tee android/test-results/texture-stride.txt
      - name: Reflective vertex preparation and final presentation regressions
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/environment_map_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread lcs/host/lcs_render_capture.cpp -o /tmp/environment-map
          /tmp/environment-map | tee android/test-results/environment-map.txt
          g++ -std=c++20 -O2 -D__ANDROID__ -Iandroid/tests/shim -Iandroid/app/src/main/cpp -Ilcs/host android/tests/gles_present_regression.cpp lcs/host/lcs_android_build.cpp lcs/host/lcs_render_capture.cpp -pthread -lEGL -lGLESv2 -o /tmp/gles-present
          /tmp/gles-present | tee android/test-results/gles-present.txt
          PSPRECOMP_GLES_FB_FETCH=0 /tmp/gles-present | tee android/test-results/gles-present-copy.txt
      - name: Validate shader sources
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          text=pathlib.Path('lcs/host/ge_gpu_backend_gles.cpp').read_text()
          shaders=re.findall(r'static constexpr char (\w+)\[\] = R"GLSL\((.*?)\)GLSL";',text,re.S)
          assert len(shaders)==4,len(shaders)
          for name,source in shaders:
              stage='vert' if 'Vertex' in name else 'frag'
              path=pathlib.Path('android/test-results')/(name+'.'+stage)
              path.write_text(source)
              subprocess.run(['glslangValidator','-S',stage,str(path)],check=True)
          PY
      - name: Build and test actual ATRAC decoders
        run: |
          bash android/tools/build_ffmpeg.sh host
          PREFIX="$PWD/android/.deps/ffmpeg-host"
          curl --fail --location --retry 3 'https://samples.ffmpeg.org/A-codecs/ATRAC3/sample.ATRAC3.66kbps.44100Hz.Stereo.wav' -o /tmp/atrac3.wav
          curl --fail --location --retry 3 'https://samples.ffmpeg.org/A-codecs/ATRAC3%2B/at3p_sample5.oma' -o /tmp/atrac3plus.oma
          sha256sum /tmp/atrac3.wav /tmp/atrac3plus.oma > android/test-results/media-input-sha256.txt
          g++ -std=c++20 -O2 -Ilcs/host -I"$PREFIX/include" android/tests/media_regression.cpp lcs/host/lcs_media_decoder.cpp -L"$PREFIX/lib" -Wl,-rpath,"$PREFIX/lib" -lavformat -lavcodec -lavutil -lswresample -lswscale lcs/host/lcs_render_capture.cpp -pthread -o /tmp/media
          LD_LIBRARY_PATH="$PREFIX/lib" /tmp/media /tmp/atrac3.wav /tmp/atrac3plus.oma | tee android/test-results/atrac-codecs.txt
      - name: Record exact source
        run: |
          git rev-parse HEAD > android/test-results/source-commit.txt
          git archive --format=tar.gz -o /tmp/LCSRecomp-Android-0.6.16-source.tar.gz HEAD
          git -C android/.deps/ffmpeg-source archive --prefix=FFmpeg-7.1.5/ --format=tar.gz -o /tmp/LCS-FFmpeg-7.1.5-source.tar.gz HEAD
      - name: Upload source and tests
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-0.6.16-source-and-tests
          path: |
            /tmp/LCSRecomp-Android-0.6.16-source.tar.gz
            /tmp/LCS-FFmpeg-7.1.5-source.tar.gz
            android/test-results/
      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Restore Android codec libraries
        id: codecs
        uses: actions/cache/restore@v5
        with:
          path: android/.deps/ffmpeg-android
          key: lcs-ffmpeg-arm64-ndk27-${{ hashFiles('android/tools/build_ffmpeg.sh') }}
      - name: Build FFmpeg ARM64 shared libraries
        run: bash android/tools/build_ffmpeg.sh android
      - name: Save Android codec libraries
        if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: android/.deps/ffmpeg-android
          key: ${{ steps.codecs.outputs.cache-primary-key }}
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
      - name: Restore native compiler cache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.cache/ccache
          key: lcs-android-ccache-${{ runner.os }}-${{ hashFiles('android/app/src/main/cpp/CMakeLists.txt', 'include/**', 'src/**', 'lcs/host/**', 'lcs/generated/**') }}
          restore-keys: |
            lcs-android-ccache-${{ runner.os }}-
      - name: Build ARM64 debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: Verify native build identity and media dependencies
        run: |
          python3 android/tests/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save native compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-0.6.16-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/build-identity.txt
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-0.6.16-failed-test-results
          path: android/test-results/
