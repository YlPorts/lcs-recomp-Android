name: Android APK

on:
  push:
    branches: [android-port]
    paths: ["android/**", "lcs/**", "src/**", "include/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", "lcs/**", "src/**", "include/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lcs-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - name: Apply checked 0.6.12 source update
        run: python3 android/tools/repair_0612.py
      - name: Component and audio regression tests
        run: |
          mkdir -p android/test-results
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -I lcs/host android/tests/android_regression.cpp -o /tmp/components
          /tmp/components | tee android/test-results/components.txt
          g++ -std=c++20 -O2 -D__ANDROID__ -pthread -Iandroid/tests/shim -Ilcs/host android/tests/audio_continuity.cpp -o /tmp/audio
          /tmp/audio | tee android/test-results/audio.txt
          g++ -std=c++20 -O1 -g -D__ANDROID__ -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Iandroid/tests/shim -Ilcs/host android/tests/audio_continuity.cpp -o /tmp/audio-san
          /tmp/audio-san | tee android/test-results/audio-sanitized.txt
          python3 android/tests/frame_boundary_regression.py | tee android/test-results/frame-boundaries.txt
          python3 android/tests/pacing_regression.py | tee android/test-results/pacing.txt
      - name: CPU geometry regression tests
        run: |
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/cpu_geometry_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread -o /tmp/geometry
          /tmp/geometry | tee android/test-results/geometry.txt
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/vertex_bytes_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread -o /tmp/vertex-bytes
          /tmp/vertex-bytes | tee android/test-results/vertex-bytes.txt
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/vertex_bytes_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread -o /tmp/vertex-bytes-san
          /tmp/vertex-bytes-san | tee android/test-results/vertex-bytes-sanitized.txt
      - name: Exact lighting cache regression
        run: |
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/lighting_cache_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread -o /tmp/lighting-cache
          /tmp/lighting-cache | tee android/test-results/lighting-cache.txt
      - name: GE command state and record reuse regressions
        run: |
          set -euo pipefail
          python3 android/tests/scale_config_regression.py | tee android/test-results/scale-config.txt
          for mode in optimized sanitized; do
            FLAGS="-std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"
            if [ "$mode" = sanitized ]; then FLAGS="-std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffunction-sections -fdata-sections -Iinclude -Ilcs/host"; fi
            g++ $FLAGS -Drender_ge_primitive=test_capture_primitive -Dflush_ge_deferred_rasterization=test_flush -c lcs/host/lcs_ge_exec.cpp -o /tmp/ge-exec-$mode.o
            g++ $FLAGS android/tests/ge_command_state_regression.cpp src/guest_memory.cpp /tmp/ge-exec-$mode.o -Wl,--gc-sections -pthread -o /tmp/ge-state-$mode
            /tmp/ge-state-$mode | tee android/test-results/ge-state-$mode.txt
            g++ $FLAGS android/tests/vertex_memo_regression.cpp src/guest_memory.cpp -Wl,--gc-sections -pthread -o /tmp/vertex-memo-$mode
            /tmp/vertex-memo-$mode | tee android/test-results/vertex-memo-$mode.txt
          done
          git show 2bd2ce61a3e155595c1eeb131cccd41b287aa6bb:lcs/host/lcs_ge_exec.cpp > /tmp/ge-exec-before.cpp
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host -Drender_ge_primitive=test_capture_primitive -Dflush_ge_deferred_rasterization=test_flush -c /tmp/ge-exec-before.cpp -o /tmp/ge-exec-before.o
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host android/tests/ge_command_state_regression.cpp src/guest_memory.cpp /tmp/ge-exec-before.o -Wl,--gc-sections -pthread -o /tmp/ge-state-before
          if /tmp/ge-state-before > android/test-results/ge-matrix-before.txt; then echo "Old executor unexpectedly passed"; exit 1; fi
          if /tmp/ge-state-before palette > android/test-results/ge-palette-before.txt; then echo "Old executor unexpectedly passed"; exit 1; fi
      - name: Install graphics test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools ccache libegl1-mesa-dev libgles2-mesa-dev
      - name: Actual GLES backend regression tests
        run: |
          g++ -std=c++20 -O2 -ffunction-sections -fdata-sections -Iinclude -Ilcs/host -c android/tests/reference_fragments.cpp -o /tmp/reference-fragments.o
          g++ -std=c++20 -O2 -D__ANDROID__ -Iandroid/tests/shim -Iandroid/app/src/main/cpp -Ilcs/host android/tests/gles_backend_integration.cpp lcs/host/lcs_android_build.cpp /tmp/reference-fragments.o -Wl,--gc-sections -pthread -lEGL -lGLESv2 -o /tmp/gles-backend
          /tmp/gles-backend | tee android/test-results/gles-backend-fetch.txt
          PSPRECOMP_GLES_FB_FETCH=0 /tmp/gles-backend | tee android/test-results/gles-backend-copy.txt
          python3 android/tests/gles_smoke.py | tee android/test-results/shader-readback.txt
      - name: Validate shader sources
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          text=pathlib.Path('lcs/host/ge_gpu_backend_gles.cpp').read_text()
          shaders=re.findall(r'static constexpr char (\w+)\[\] = R"GLSL\((.*?)\)GLSL";',text,re.S)
          assert len(shaders)==4,len(shaders)
          for name,source in shaders:
              stage='vert' if 'Vertex' in name else 'frag'
              path=pathlib.Path('android/test-results')/(name+'.'+stage)
              path.write_text(source)
              subprocess.run(['glslangValidator','-S',stage,str(path)],check=True)
          PY
      - name: Build and test actual ATRAC decoders
        run: |
          bash android/tools/build_ffmpeg.sh host
          PREFIX="$PWD/android/.deps/ffmpeg-host"
          curl --fail --location --retry 3 'https://samples.ffmpeg.org/A-codecs/ATRAC3/sample.ATRAC3.66kbps.44100Hz.Stereo.wav' -o /tmp/atrac3.wav
          curl --fail --location --retry 3 'https://samples.ffmpeg.org/A-codecs/ATRAC3%2B/at3p_sample5.oma' -o /tmp/atrac3plus.oma
          sha256sum /tmp/atrac3.wav /tmp/atrac3plus.oma > android/test-results/media-input-sha256.txt
          g++ -std=c++20 -O2 -Ilcs/host -I"$PREFIX/include" android/tests/media_regression.cpp lcs/host/lcs_media_decoder.cpp -L"$PREFIX/lib" -Wl,-rpath,"$PREFIX/lib" -lavformat -lavcodec -lavutil -lswresample -lswscale -o /tmp/media
          LD_LIBRARY_PATH="$PREFIX/lib" /tmp/media /tmp/atrac3.wav /tmp/atrac3plus.oma | tee android/test-results/atrac-codecs.txt
      - name: Commit tested readable source changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/android-port'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add android/tools/repair_0612.patch lcs/host/lcs_ge_vertex_memo.hpp lcs/host/lcs_ge_triangle_indices.hpp android/tests/ge_command_state_regression.cpp android/tests/vertex_memo_regression.cpp android/tests/scale_config_regression.py
          git add lcs/host/lcs_android_build.cpp lcs/host/lcs_android_build.hpp android/REPAIR_0612.md android/tests/lighting_cache_regression.cpp android/tests/reference_fragments.cpp android/tests/verify_apk.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply tested Android 0.6.12 texture matrix, CLUT snapshots, batching and selectable 2x [skip ci]"
            git push origin HEAD:android-port
          fi
      - name: Record exact source
        run: |
          git rev-parse HEAD > android/test-results/source-commit.txt
          git archive --format=tar.gz -o /tmp/LCSRecomp-Android-0.6.12-source.tar.gz HEAD
          git -C android/.deps/ffmpeg-source archive --prefix=FFmpeg-7.1.5/ --format=tar.gz -o /tmp/LCS-FFmpeg-7.1.5-source.tar.gz HEAD
      - name: Upload source and tests
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-0.6.12-source-and-tests
          path: |
            /tmp/LCSRecomp-Android-0.6.12-source.tar.gz
            /tmp/LCS-FFmpeg-7.1.5-source.tar.gz
            android/test-results/
      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Restore Android codec libraries
        id: codecs
        uses: actions/cache/restore@v5
        with:
          path: android/.deps/ffmpeg-android
          key: lcs-ffmpeg-arm64-ndk27-${{ hashFiles('android/tools/build_ffmpeg.sh') }}
      - name: Build FFmpeg ARM64 shared libraries
        run: bash android/tools/build_ffmpeg.sh android
      - name: Save Android codec libraries
        if: steps.codecs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: android/.deps/ffmpeg-android
          key: ${{ steps.codecs.outputs.cache-primary-key }}
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
      - name: Restore native compiler cache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.cache/ccache
          key: lcs-android-ccache-${{ runner.os }}-${{ hashFiles('android/app/src/main/cpp/CMakeLists.txt', 'include/**', 'src/**', 'lcs/host/**', 'lcs/generated/**') }}
          restore-keys: |
            lcs-android-ccache-${{ runner.os }}-
      - name: Build ARM64 debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: Verify native build identity and media dependencies
        run: |
          python3 android/tests/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save native compiler cache
        if: always() && steps.ccache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-0.6.12-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/build-identity.txt
          if-no-files-found: error
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-0.6.12-failed-test-results
          path: android/test-results/
