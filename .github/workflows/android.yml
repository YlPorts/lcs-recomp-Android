name: Android APK

on:
  push:
    branches: [android-port]
    paths:
      - "android/**"
      - "lcs/**"
      - "src/**"
      - "include/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "lcs/**"
      - "src/**"
      - "include/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcs-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore native compiler cache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.cache/ccache
          key: lcs-android-ccache-${{ runner.os }}-${{ hashFiles('android/app/src/main/cpp/CMakeLists.txt', 'include/**', 'src/**', 'lcs/host/**', 'lcs/generated/**') }}
          restore-keys: |
            lcs-android-ccache-${{ runner.os }}-

      - name: Build ARM64 debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Save native compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LCSRecomp-Android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
